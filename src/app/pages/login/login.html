<div class="min-h-screen bg-zinc-100 px-4 py-10 text-zinc-900">
  <div class="mx-auto flex min-h-[calc(100vh-5rem)] max-w-6xl items-center justify-center">
    <div
      class="grid w-full max-w-4xl overflow-hidden rounded-3xl border border-zinc-200 bg-white shadow-[0_20px_60px_rgba(0,0,0,0.08)] lg:grid-cols-[1.1fr_0.9fr]"
    >
      <section class="hidden bg-zinc-900 p-10 text-zinc-100 lg:flex lg:flex-col lg:justify-between">
        <div>
          <h1 class="mt-6 max-w-sm text-4xl font-semibold leading-tight">
            Gerencie sua loja em um só lugar.
          </h1>
          <p class="mt-4 max-w-md text-sm leading-6 text-zinc-400">
            Acesse vendas, estoque, pedidos e clientes em uma área simples e direta.
          </p>
        </div>

        <div class="rounded-2xl border border-white/10 bg-white/5 p-5">
          <p class="text-sm text-zinc-300">
            Ambiente interno para a gestão administrativa da loja.
          </p>
        </div>
      </section>

      <section class="flex items-center justify-center p-6 sm:p-10">
        <div class="w-full max-w-md">
          <div class="mb-8">
            <p class="text-sm font-medium text-zinc-500">Acesso administrativo</p>
            <h2 class="mt-2 text-3xl font-semibold tracking-tight text-zinc-900">
              Central de gestão
            </h2>
            <p class="mt-3 text-sm leading-6 text-zinc-500">
              Informe seu e-mail e sua senha para continuar.
            </p>
          </div>

          <form class="space-y-5">
            <div>
              <label for="email" class="mb-2 block text-sm font-medium text-zinc-700">E-mail</label>
              <input
                type="email"
                name="email"
                [(ngModel)]="email"
                placeholder="contato@empresa.com"
                class="h-12 w-full rounded-xl border border-zinc-300 bg-white px-4 text-sm outline-none transition focus:border-zinc-900"
              />
            </div>

            <div>
              <div class="mb-2 flex items-center justify-between">
                <label for="password" class="block text-sm font-medium text-zinc-700">Senha</label>
                <button
                  type="button"
                  class="text-sm font-medium text-zinc-500 transition hover:text-zinc-900"
                >
                  Esqueci minha senha
                </button>
              </div>
              <input
                type="password"
                name="password"
                [(ngModel)]="password"
                placeholder="Digite sua senha"
                class="h-12 w-full rounded-xl border border-zinc-300 bg-white px-4 text-sm outline-none transition focus:border-zinc-900"
              />
            </div>
            <p *ngIf="errorMessage" style="color: red">
              {{ errorMessage }}
            </p>

            <button
              type="button"
              (click)="login()"
              class="flex h-12 w-full items-center justify-center rounded-xl bg-zinc-900 text-sm font-medium text-white transition hover:bg-zinc-800"
            >
              Entrar
            </button>
          </form>
        </div>
      </section>
    </div>
  </div>
</div>
